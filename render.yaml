services:
  - type: web
    name: nexatech-dropshipping-store
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 24.12.0
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
      - key: FORCE_DEFAULT_CONTENT
        value: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
    healthCheckPath: /api/health
