services:
  - type: web
    name: nexatech-dropshipping-store
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 24.12.0
      - key: JWT_SECRET
        generateValue: true
      # Only used once, when the admin_users table is empty. Set a strong password
      # (12+ chars) in the Render dashboard before the first deploy.
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: SITE_URL
        value: https://dropshippingstore.dpdns.org
      # Optional analytics and search-console verification IDs.
      - key: GA4_ID
        sync: false
      - key: CLARITY_ID
        sync: false
      - key: GSC_VERIFICATION
        sync: false
      - key: BING_VERIFICATION
        sync: false
      - key: PORT
        value: 10000
      - key: FORCE_DEFAULT_CONTENT
        value: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      # Postgres is the single source of truth (no disk): leads, content, uploads
      # (media_blobs) and snapshots (backup_snapshots) all live in the database.
      # Set this in the Render dashboard (already done) - app auto-switches from SQLite.
      - key: DATABASE_URL
        sync: false
    healthCheckPath: /api/health
